name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml names the version, but rustup does not promise to
      # fetch it on first use. With no arguments this installs what the file asks for.
      - name: toolchain
        run: rustup toolchain install

      - name: format
        run: cargo fmt --check

      # --locked fails the run when Cargo.lock no longer matches the manifests,
      # instead of quietly resolving again.
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: test
        run: cargo test --locked

      - name: build
        run: cargo build --locked --release

  # The desktop shell is not among the default members: it needs a WebView to
  # build, which Windows runners have and a plain Linux runner does not.
  desktop:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: toolchain
        run: rustup toolchain install

      # The tests call every command through Tauri's IPC on its mock runtime.
      # No window is opened and the interface does not have to be built.
      - name: clippy
        run: cargo clippy -p filesweep-desktop --locked --all-targets -- -D warnings

      - name: test
        run: cargo test -p filesweep-desktop --locked
